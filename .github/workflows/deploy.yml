name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC sign-in to Azure, no stored password
  contents: read

concurrency: deploy-dev

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      # A non-superuser, so the row-level security tests mean something.
      TEST_DATABASE_URL: postgres://hsapp:hsapp@localhost:5432/hstest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Create test database
        env: { PGPASSWORD: postgres }
        run: |
          psql -h localhost -U postgres -c "create role hsapp login password 'hsapp'"
          psql -h localhost -U postgres -c "create database hstest owner hsapp"
      - run: npm ci
      - run: npm test --workspaces --if-present
      - run: npm run typecheck -w app

  deploy:
    needs: test
    # Skipped until infra/bootstrap.sh has set the repository variables.
    if: vars.RESOURCE_GROUP != ''
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - name: Sign in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Registry and app identity
        id: reg
        run: |
          out=$(az deployment group create --resource-group "${{ vars.RESOURCE_GROUP }}" --template-file infra/registry.bicep \
            --query properties.outputs -o json)
          echo "name=$(jq -r .registryName.value <<<"$out")" >> "$GITHUB_OUTPUT"
          echo "server=$(jq -r .registryServer.value <<<"$out")" >> "$GITHUB_OUTPUT"
          echo "identity=$(jq -r .identityName.value <<<"$out")" >> "$GITHUB_OUTPUT"

      - name: Build and push the app image
        id: img
        run: |
          az acr login --name "${{ steps.reg.outputs.name }}"
          image="${{ steps.reg.outputs.server }}/heard-supported:${{ github.sha }}"
          docker build -t "$image" .
          docker push "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Deploy infrastructure and app
        id: infra
        run: |
          out=$(az deployment group create \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters \
              webAppName="${{ vars.WEBAPP_NAME }}" \
              image="${{ steps.img.outputs.image }}" \
              registryServer="${{ steps.reg.outputs.server }}" \
              identityName="${{ steps.reg.outputs.identity }}" \
              minReplicas="${{ vars.MIN_REPLICAS || '0' }}" \
              aiLocation="${{ vars.AI_LOCATION }}" \
              modelName="${{ vars.MODEL_NAME }}" \
              modelVersion="${{ vars.MODEL_VERSION }}" \
              modelFormat="${{ vars.MODEL_FORMAT }}" \
              modelSku="${{ vars.MODEL_SKU || 'DataZoneStandard' }}" \
              modelCapacity="${{ vars.MODEL_CAPACITY || '20' }}" \
              entraClientId="${{ vars.ENTRA_CLIENT_ID }}" \
              entraClientSecret="${{ secrets.ENTRA_CLIENT_SECRET }}" \
              nextAuthSecret="${{ secrets.NEXTAUTH_SECRET }}" \
              dbAdminPassword="${{ secrets.DB_ADMIN_PASSWORD }}" \
              deployerPrincipalId="${{ vars.DEPLOYER_PRINCIPAL_ID }}" \
              budgetEmail="${{ vars.BUDGET_EMAIL }}" \
              firstAdminEmail="${{ vars.FIRST_ADMIN_EMAIL || vars.BUDGET_EMAIL }}" \
              budgetStart="${{ vars.BUDGET_START }}" \
            --query properties.outputs -o json)
          echo "url=$(jq -r .webUrl.value <<<"$out")" >> "$GITHUB_OUTPUT"
          echo "redirect=$(jq -r .signInRedirect.value <<<"$out")" >> "$GITHUB_OUTPUT"

      - name: Check the app answers
        run: |
          url="${{ steps.infra.outputs.url }}"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url/signup" || true)
            if [ "$code" = 200 ]; then echo "App is up at $url"; break; fi
            echo "waiting ($code)"; sleep 10
          done
          [ "$code" = 200 ] || { echo "The app did not answer at $url"; exit 1; }
          {
            echo "### Deployed"
            echo "App: $url"
            echo
            echo "Sign-in needs this redirect address on the sign-in app registration (once):"
            echo '```'
            echo "az ad app update --id ${{ vars.ENTRA_CLIENT_ID }} --web-redirect-uris ${{ steps.infra.outputs.redirect }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
